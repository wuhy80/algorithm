<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#111816"><meta name="description" content="AVL 树旋转、自平衡插入与删除的动画演示"><title>Balance Lab · AVL 树实验场</title><link rel="stylesheet" href="styles.css"></head>
<body><div class="lab-shell">
  <aside class="panel" aria-label="AVL 树控制面板">
    <header class="brand"><div class="brand-mark tree-mark" aria-hidden="true"><i></i><i></i><i></i></div><div><span>BALANCE LAB / AVL</span><h1>AVL 树实验场</h1></div></header>
    <section><div class="section-title"><h2>节点操作</h2><small>01</small></div><label class="field-label" for="node-value">键值</label><div class="value-entry"><input id="node-value" type="number" min="0" max="99" value="68"><button id="insert" type="button">插入并平衡</button><button id="find" type="button">查找路径</button></div><div class="command-grid"><button id="remove" class="danger" type="button">删除并平衡</button><button id="reset" type="button">重置示例</button></div></section>
    <section><div class="section-title"><h2>旋转案例</h2><small>02</small></div><div class="command-grid"><button type="button" data-demo="ll">LL 右旋</button><button type="button" data-demo="rr">RR 左旋</button></div><div class="command-grid"><button type="button" data-demo="lr">LR 双旋</button><button type="button" data-demo="rl">RL 双旋</button></div></section>
    <section><div class="section-title"><h2>播放控制</h2><small>03</small></div><label class="range" for="speed"><span><b>动画速度</b><output id="speed-value">5</output></span><input id="speed" type="range" min="1" max="10" value="5"></label><div class="playback"><button id="step" type="button"><span class="step-icon" aria-hidden="true"></span>单步</button><button id="pause" class="primary" type="button"><span id="pause-icon" class="pause-icon" aria-hidden="true"></span><b id="pause-label">暂停</b></button></div></section>
    <footer><span>|BALANCE| ≤ 1</span><span>O(LOG N)</span></footer>
  </aside>
  <main class="stage"><canvas id="canvas" aria-label="AVL 树平衡因子与旋转动画"></canvas><header class="stage-header"><div class="live"><i id="live-dot"></i><div><span>当前阶段</span><strong id="status">树处于平衡状态</strong></div></div><div class="metrics" aria-live="polite"><div><span>树高</span><strong id="metric-height">3</strong></div><div><span>最大平衡因子</span><strong id="metric-balance">1</strong></div><div><span>旋转</span><strong id="metric-rotations">0</strong></div></div><div class="stage-actions"><button id="stage-reset" type="button"><span aria-hidden="true">↻</span><b>重置</b></button><button id="stage-pause" class="primary" type="button"><span id="stage-pause-icon" class="pause-icon" aria-hidden="true"></span><b id="stage-pause-label">暂停</b></button></div></header><div class="stage-note"><span id="operation-label">每个节点显示 BF = 左高 − 右高</span><i></i><span id="step-label">READY</span></div></main>
</div><script src="app.js"></script></body></html>
