<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#111816"><meta name="description" content="二叉堆上浮、下沉与优先队列操作的交互式动画演示"><title>Heap Lab · 优先队列实验场</title><link rel="stylesheet" href="styles.css"></head>
<body><div class="lab-shell">
  <aside class="panel" aria-label="堆与优先队列控制面板">
    <header class="brand"><div class="brand-mark heap-mark" aria-hidden="true"><i></i><i></i><i></i></div><div><span>HEAP LAB / PRIORITY QUEUE</span><h1>堆与优先队列实验场</h1></div></header>
    <section><div class="section-title"><h2>队列操作</h2><small>01</small></div><label class="field-label" for="node-value">优先级</label><div class="value-entry"><input id="node-value" type="number" min="0" max="99" value="88"><button id="enqueue" type="button">入队并上浮</button><button id="extract" type="button">提取堆顶</button></div><div class="command-grid"><button id="peek" type="button">查看堆顶</button><button id="randomize" type="button">随机队列</button></div></section>
    <section><div class="section-title"><h2>堆类型</h2><small>02</small></div><div class="command-grid" id="heap-mode" role="group" aria-label="堆类型"><button type="button" data-mode="max" aria-pressed="true">最大堆</button><button type="button" data-mode="min" aria-pressed="false">最小堆</button></div></section>
    <section><div class="section-title"><h2>播放控制</h2><small>03</small></div><label class="range" for="speed"><span><b>动画速度</b><output id="speed-value">5</output></span><input id="speed" type="range" min="1" max="10" value="5"></label><div class="playback"><button id="step" type="button"><span class="step-icon" aria-hidden="true"></span>单步</button><button id="pause" class="primary" type="button"><span id="pause-icon" class="pause-icon" aria-hidden="true"></span><b id="pause-label">暂停</b></button></div></section>
    <section><div class="section-title"><h2>结构</h2><small>04</small></div><button id="reset" class="wide-button" type="button"><span aria-hidden="true">↻</span>重置示例</button><div class="legend" aria-hidden="true"><span><i class="current"></i>比较节点</span><span><i class="write"></i>交换路径</span><span><i class="target"></i>提取元素</span></div></section>
    <footer><span>COMPLETE TREE</span><span>ARRAY BACKED</span></footer>
  </aside>
  <main class="stage"><canvas id="canvas" aria-label="二叉堆树形结构与数组映射动画"></canvas><header class="stage-header"><div class="live"><i id="live-dot"></i><div><span>当前阶段</span><strong id="status">最大堆已就绪</strong></div></div><div class="metrics" aria-live="polite"><div><span>元素</span><strong id="metric-count">9</strong></div><div><span>层数</span><strong id="metric-height">4</strong></div><div><span>交换</span><strong id="metric-swaps">0</strong></div></div><div class="stage-actions"><button id="stage-reset" type="button"><span aria-hidden="true">↻</span><b>重置</b></button><button id="stage-pause" class="primary" type="button"><span id="stage-pause-icon" class="pause-icon" aria-hidden="true"></span><b id="stage-pause-label">暂停</b></button></div></header><div class="stage-note"><span id="operation-label">parent(i) = ⌊(i−1)/2⌋</span><i></i><span id="step-label">READY</span></div></main>
</div><script src="app.js"></script></body></html>
