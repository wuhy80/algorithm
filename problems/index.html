<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#16201e">
  <meta name="description" content="算法可视化图谱在线题库：筛选题目、阅读讲解并在线运行 Python。">
  <link rel="icon" href="data:,">
  <title>在线题库 · Algorithm Atlas</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="app-header">
    <a class="brand" href="../" aria-label="返回算法可视化图谱">
      <span class="brand-mark">AV</span>
      <span><b>在线题库</b><small>PROBLEM SET</small></span>
    </a>
    <nav aria-label="站点导航">
      <a href="../"><i data-lucide="network" aria-hidden="true"></i>动画图谱</a>
      <a href="../neural-network-tools/"><i data-lucide="blocks" aria-hidden="true"></i>神经工具</a>
      <a href="https://github.com/wuhy80/algorithm" target="_blank" rel="noreferrer" aria-label="打开 GitHub"><i data-lucide="github" aria-hidden="true"></i></a>
    </nav>
  </header>

  <main id="list-view" class="list-view">
    <section class="list-heading" aria-labelledby="problem-title">
      <div>
        <p class="eyebrow">ALGORITHM PRACTICE</p>
        <h1 id="problem-title">算法与数据结构题库</h1>
        <p>从动画理解状态，再用 Python 独立完成实现。</p>
      </div>
      <div class="bank-stats" aria-label="题库统计">
        <span><b id="bank-total">254</b><small>全部题目</small></span>
        <span><b id="bank-ready">50</b><small>可在线判题</small></span>
        <span><b id="bank-solved">0</b><small>本机已通过</small></span>
      </div>
    </section>

    <section class="filters" aria-label="题目筛选">
      <label class="search-field" for="problem-search">
        <i data-lucide="search" aria-hidden="true"></i>
        <span class="sr-only">搜索题目</span>
        <input id="problem-search" type="search" autocomplete="off" placeholder="搜索名称、题意或标签">
      </label>
      <label><span>分类</span><select id="category-filter"><option value="">全部分类</option></select></label>
      <label><span>难度</span><select id="difficulty-filter"><option value="">全部难度</option><option>基础</option><option>进阶</option><option>高级</option></select></label>
      <label><span>阶段</span><select id="stage-filter"><option value="">全部阶段</option><option value="1">阶段 1</option><option value="2">阶段 2</option><option value="3">阶段 3</option><option value="4">阶段 4</option></select></label>
      <label><span>进度</span><select id="status-filter"><option value="">全部状态</option><option value="ready">可在线判题</option><option value="solved">已通过</option><option value="attempted">尝试过</option><option value="todo">未开始</option><option value="favorite">已收藏</option></select></label>
      <label><span>排序</span><select id="sort-filter"><option value="id">推荐顺序</option><option value="difficulty">难度</option><option value="title">名称</option></select></label>
      <button id="reset-filters" class="icon-button" type="button" aria-label="清除筛选" data-tooltip="清除筛选"><i data-lucide="rotate-ccw" aria-hidden="true"></i></button>
    </section>

    <section class="problem-bank" aria-labelledby="result-summary">
      <div class="result-bar"><span id="result-summary">0 道题目</span><span id="active-filter"></span></div>
      <div class="table-wrap">
        <table class="problem-table">
          <thead><tr><th class="status-column">状态</th><th class="id-column">题号</th><th>题目</th><th>分类</th><th>难度</th><th>阶段</th><th class="action-column">收藏</th></tr></thead>
          <tbody id="problem-rows"></tbody>
        </table>
      </div>
      <div id="empty-state" class="empty-state" hidden><i data-lucide="search-x" aria-hidden="true"></i><strong>没有匹配题目</strong><button id="empty-reset" type="button">清除筛选</button></div>
    </section>
  </main>

  <main id="detail-view" class="detail-view" hidden>
    <header class="problem-header">
      <button id="back-to-list" class="icon-button" type="button" aria-label="返回题库" data-tooltip="返回题库"><i data-lucide="arrow-left" aria-hidden="true"></i></button>
      <div class="problem-heading"><span id="detail-id"></span><h1 id="detail-title"></h1><div id="detail-meta" class="detail-meta"></div></div>
      <div class="problem-links">
        <button id="detail-favorite" class="icon-button" type="button" aria-label="收藏题目" data-tooltip="收藏题目"><i data-lucide="bookmark" aria-hidden="true"></i></button>
        <a id="detail-demo" href="#"><i data-lucide="play" aria-hidden="true"></i>动画</a>
        <a id="detail-source" href="#" target="_blank" rel="noreferrer"><i data-lucide="code-2" aria-hidden="true"></i>源码</a>
      </div>
    </header>

    <div class="mobile-panes" role="group" aria-label="移动端内容切换">
      <button type="button" data-pane="statement" aria-pressed="true">题目与讲解</button>
      <button type="button" data-pane="code" aria-pressed="false">Python</button>
    </div>

    <div class="problem-workspace" data-mobile-pane="statement">
      <section class="statement-pane" aria-label="题目内容">
        <div class="content-tabs" role="tablist" aria-label="题目内容标签">
          <button type="button" role="tab" data-content-tab="statement" aria-selected="true">题目</button>
          <button type="button" role="tab" data-content-tab="explanation" aria-selected="false">讲解</button>
        </div>
        <article id="statement-content" class="reading-content"></article>
        <article id="explanation-content" class="reading-content" hidden></article>
      </section>

      <section class="code-pane" aria-label="Python 编辑与判题">
        <header class="editor-toolbar">
          <span><i data-lucide="file-code-2" aria-hidden="true"></i>Python 3</span>
          <div>
            <button id="reset-code" class="icon-button" type="button" aria-label="恢复初始代码" data-tooltip="恢复初始代码"><i data-lucide="rotate-ccw" aria-hidden="true"></i></button>
            <button id="show-reference" type="button"><i data-lucide="book-open" aria-hidden="true"></i>参考实现</button>
          </div>
        </header>
        <textarea id="code-editor" spellcheck="false" aria-label="Python 代码编辑器"></textarea>
        <pre id="reference-code" class="reference-code" hidden><code></code></pre>
        <div id="judge-unavailable" class="judge-unavailable" hidden><i data-lucide="construction" aria-hidden="true"></i><span>本题讲解已收录，Python 判题将在后续批次开放。</span></div>
        <section class="judge-output" aria-live="polite">
          <header><strong id="judge-title">运行结果</strong><span id="python-status">Python 尚未加载</span></header>
          <div id="judge-results" class="judge-results"><p>选择“运行样例”检查公开用例，或提交全部测试。</p></div>
        </section>
        <footer class="editor-actions">
          <button id="run-code" type="button"><i data-lucide="play" aria-hidden="true"></i>运行样例</button>
          <button id="submit-code" class="primary" type="button"><i data-lucide="send" aria-hidden="true"></i>提交判题</button>
        </footer>
      </section>
    </div>
  </main>

  <script src="problem-data.js"></script>
  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
