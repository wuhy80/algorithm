<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="theme-color" content="#171714"><title>Sort Lab · 冒泡排序</title><link rel="stylesheet" href="styles.css"></head><body>
<div class="lab-shell"><aside class="panel"><header class="brand"><div class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></div><div><span>SORT LAB / 02</span><h1>冒泡排序</h1></div></header>
<section><div class="section-title"><h2>数据分布</h2><small>01</small></div><label class="field" for="pattern"><span>生成方式</span><select id="pattern"><option value="random">随机数据</option><option value="nearly">近乎有序</option><option value="reversed">完全逆序</option></select></label><label class="range" for="size"><span><b>元素数量</b><output id="size-value">28</output></span><input id="size" type="range" min="8" max="56" step="1" value="28"></label><button id="generate" class="panel-button" type="button">生成新数据</button></section>
<section><div class="section-title"><h2>自定义数组</h2><small>02</small></div><label class="field" for="custom-data"><span>数字（逗号或空格分隔）</span><textarea id="custom-data" rows="3" placeholder="42, 18, 73, 9, 56"></textarea></label><button id="apply-data" class="panel-button secondary" type="button">应用输入</button><p class="validation" id="validation" aria-live="polite"></p></section>
<section><div class="section-title"><h2>演示速度</h2><small>03</small></div><label class="range no-top" for="speed"><span><b>播放速度</b><output id="speed-value">1.0×</output></span><input id="speed" type="range" min="0.25" max="4" step="0.25" value="1"></label><div class="legend"><span><i class="compare"></i>比较</span><span><i class="swap"></i>交换</span><span><i class="sorted"></i>已就位</span></div></section><footer><span>ADJACENT EXCHANGE</span><span>O(N²)</span></footer></aside>
<main class="stage"><canvas id="canvas" aria-label="冒泡排序相邻元素比较动画"></canvas><header class="stage-header"><div class="live"><i></i><div><span id="phase-label">等待开始</span><strong id="status-text">从左向右扫描</strong></div></div><div class="metrics"><div><span>比较</span><strong id="comparisons">0</strong></div><div><span>交换</span><strong id="swaps">0</strong></div><div><span>轮次</span><strong id="passes">0</strong></div></div><div class="actions"><button id="reset" type="button"><span aria-hidden="true">↻</span><b>重置</b></button><button id="step" type="button"><span aria-hidden="true">→</span><b>单步</b></button><button id="play" class="primary" type="button"><span id="play-icon">▶</span><b id="play-label">播放</b></button></div></header><div class="stage-note"><span id="scan-status">PASS 0 · INDEX 0</span><i></i><span>较大元素逐轮上浮</span></div></main></div><script src="app.js"></script></body></html>
