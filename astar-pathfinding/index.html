<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#12191b"><title>Path Lab · A* 寻路实验场</title><link rel="stylesheet" href="styles.css"></head><body>
<div class="lab-shell"><aside class="panel"><header class="brand"><div class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></div><div><span>PATH LAB / A*</span><h1>A* 寻路实验场</h1></div></header>
<section><div class="section-title"><h2>搜索空间</h2><small>01</small></div><label class="range" for="grid-size"><span><b>网格列数</b><output id="grid-size-value">48</output></span><input id="grid-size" type="range" min="20" max="84" step="2" value="48"></label><label class="range" for="density"><span><b>障碍密度</b><output id="density-value">22%</output></span><input id="density" type="range" min="0" max="42" step="1" value="22"></label><div class="check-row"><label for="diagonal"><input id="diagonal" type="checkbox" checked>允许对角移动</label></div></section>
<section><div class="section-title"><h2>搜索参数</h2><small>02</small></div><label class="range" for="heuristic"><span><b>启发式权重</b><output id="heuristic-value">1.0</output></span><input id="heuristic" type="range" min="0" max="3" step="0.1" value="1"></label><label class="range" for="speed"><span><b>每帧步数</b><output id="speed-value">8</output></span><input id="speed" type="range" min="1" max="80" step="1" value="8"></label></section>
<section><div class="section-title"><h2>画布工具</h2><small>03</small></div><div class="tool-grid" id="tools" role="group" aria-label="网格编辑工具"><button type="button" data-tool="wall" aria-pressed="true">绘制障碍</button><button type="button" data-tool="erase" aria-pressed="false">擦除障碍</button><button type="button" data-tool="start" aria-pressed="false">移动起点</button><button type="button" data-tool="goal" aria-pressed="false">移动终点</button></div><div class="legend"><span><i class="nest"></i>起点</span><span><i class="food"></i>终点</span><span><i class="trail"></i>最终路径</span></div></section><footer><span>BEST FIRST SEARCH</span><span>F = G + H</span></footer></aside>
<main class="stage"><canvas id="canvas" aria-label="A* 寻路动态搜索网格"></canvas><header class="stage-header"><div class="live"><i></i><div><span>搜索状态</span><strong id="status">正在搜索</strong></div></div><div class="metrics" aria-live="polite"><div><span>已访问</span><strong id="visited">0</strong></div><div><span>开放集</span><strong id="frontier">0</strong></div><div><span>路径长度</span><strong id="path-length">--</strong></div></div><div class="actions"><button id="randomize" type="button"><span aria-hidden="true">✦</span><b>随机地图</b></button><button id="run" class="primary" type="button"><span id="run-icon" aria-hidden="true">Ⅱ</span><b id="run-label">暂停</b></button></div></header><div class="stage-note"><span>蓝色为搜索前沿，红色为已访问区域</span><i></i><span id="grid-label">48 × 32</span></div></main></div><script src="app.js"></script></body></html>
