<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#12191b"><title>Fourier Lab · 傅里叶旋轮实验场</title><link rel="stylesheet" href="styles.css"></head><body>
<div class="lab-shell"><aside class="panel"><header class="brand"><div class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></div><div><span>FOURIER LAB / DFT</span><h1>傅里叶旋轮实验场</h1></div></header>
<section><div class="section-title"><h2>输入轮廓</h2><small>01</small></div><div class="tool-grid" id="shapes" role="group" aria-label="输入轮廓"><button type="button" data-shape="heart" aria-pressed="true">心形</button><button type="button" data-shape="star" aria-pressed="false">星形</button><button type="button" data-shape="infinity" aria-pressed="false">无穷符号</button><button type="button" data-shape="rose" aria-pressed="false">玫瑰曲线</button><button type="button" data-shape="draw" aria-pressed="false">自由绘制</button><button type="button" id="clear-trace">清除轨迹</button></div><div class="legend"><span><i class="nest"></i>旋转向量</span><span><i class="food"></i>重建轮廓</span><span><i class="trail"></i>复平面轨迹</span></div></section>
<section><div class="section-title"><h2>频谱参数</h2><small>02</small></div><label class="range" for="terms"><span><b>傅里叶项数</b><output id="terms-value">72</output></span><input id="terms" type="range" min="3" max="180" step="1" value="72"></label><label class="range" for="speed"><span><b>绘制速度</b><output id="speed-value">1.0×</output></span><input id="speed" type="range" min="0.2" max="3" step="0.1" value="1"></label><label class="range" for="scale"><span><b>轮廓尺寸</b><output id="scale-value">1.0</output></span><input id="scale" type="range" min="0.5" max="1.45" step="0.05" value="1"></label></section>
<section><div class="section-title"><h2>绘制层</h2><small>03</small></div><div class="check-row"><label for="circles"><input id="circles" type="checkbox" checked>显示旋轮与向量</label></div><div class="check-row"><label for="spectrum"><input id="spectrum" type="checkbox" checked>显示频谱基线</label></div></section><footer><span>DISCRETE FOURIER</span><span>COMPLEX SERIES</span></footer></aside>
<main class="stage"><canvas id="canvas" aria-label="傅里叶旋轮轮廓重建动画"></canvas><header class="stage-header"><div class="live"><i></i><div><span>重建状态</span><strong id="status">心形轮廓</strong></div></div><div class="metrics" aria-live="polite"><div><span>采样点</span><strong>256</strong></div><div><span>启用频率</span><strong id="metric-terms">72</strong></div><div><span>轨迹点</span><strong id="trace-count">0</strong></div></div><div class="actions"><button id="restart" type="button"><span aria-hidden="true">↺</span><b>重新绘制</b></button><button id="pause" class="primary" type="button"><span id="pause-icon" aria-hidden="true">Ⅱ</span><b id="pause-label">暂停</b></button></div></header><div class="stage-note"><span id="frequency">DOMINANT FREQ 1</span><i></i><span>Σ Cₖeⁱᵏᵗ</span></div></main></div><script src="app.js"></script></body></html>
