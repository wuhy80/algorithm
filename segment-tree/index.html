<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#171619"><link rel="icon" href="data:,"><title>Range Lab · 线段树</title><link rel="stylesheet" href="styles.css"></head><body><div class="shell"><aside class="panel"><header class="brand"><b>ST</b><div><small>RANGE / SEGMENT TREE</small><h1>线段树</h1></div></header><section><h2>区间操作 <i>01</i></h2><div class="selects"><label>左端<input id="left" type="number" min="0" max="11" value="2"></label><label>右端<input id="right" type="number" min="0" max="11" value="8"></label></div><div class="tools"><button id="query" type="button">区间求和</button><button id="update" type="button">单点更新</button></div><label class="field">更新值<input id="value" type="number" value="15"></label></section><section><h2>演示参数 <i>02</i></h2><label class="range"><span>播放速度 <output id="speed-value">1.0×</output></span><input id="speed" type="range" min="0.25" max="3" step="0.25" value="1"></label><p>查询把目标区间拆成少量完整节点；单点更新沿根到叶路径重新计算区间和。</p></section><footer>RANGE QUERY · O(LOG N)</footer></aside><main class="stage"><canvas id="canvas" aria-label="线段树区间查询与单点更新动画"></canvas><header class="top"><div class="live"><i></i><span><small>当前步骤</small><strong id="status">等待操作</strong></span></div><div class="stats"><span>访问节点 <b id="visited">0</b></span><span>查询结果 <b id="result">--</b></span><span>数组长度 <b id="size">12</b></span></div><div class="actions"><button id="random" type="button">随机</button><button id="step" type="button">单步</button><button id="play" class="primary" type="button">播放</button></div></header><div class="note" id="note">SUM SEGMENT TREE</div></main></div><script src="app.js"></script></body></html>
