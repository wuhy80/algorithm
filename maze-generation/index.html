<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#12191b"><title>Maze Lab · 迷宫生成实验场</title><link rel="stylesheet" href="styles.css"></head><body>
<div class="lab-shell"><aside class="panel"><header class="brand"><div class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></div><div><span>MAZE LAB / GRAPH</span><h1>迷宫生成实验场</h1></div></header>
<section><div class="section-title"><h2>生成算法</h2><small>01</small></div><div class="tool-grid" id="algorithms" role="group" aria-label="迷宫生成算法"><button type="button" data-algorithm="backtracker" aria-pressed="true">递归回溯</button><button type="button" data-algorithm="prim" aria-pressed="false">随机 Prim</button><button type="button" data-algorithm="kruskal" aria-pressed="false">Kruskal</button><button type="button" id="single-step">单步执行</button></div><div class="legend"><span><i class="nest"></i>生成前沿</span><span><i class="food"></i>求解路径</span><span><i class="trail"></i>搜索区域</span></div></section>
<section><div class="section-title"><h2>网格参数</h2><small>02</small></div><label class="range" for="columns"><span><b>迷宫列数</b><output id="columns-value">38</output></span><input id="columns" type="range" min="14" max="70" step="2" value="38"></label><label class="range" for="speed"><span><b>每帧步数</b><output id="speed-value">4</output></span><input id="speed" type="range" min="1" max="60" step="1" value="4"></label></section>
<section><div class="section-title"><h2>演示流程</h2><small>03</small></div><div class="check-row"><label for="auto-solve"><input id="auto-solve" type="checkbox" checked>生成后自动寻路</label></div><div class="check-row"><label for="loop"><input id="loop" type="checkbox">循环生成</label></div></section><footer><span>SPANNING TREE</span><span>BREADTH FIRST SEARCH</span></footer></aside>
<main class="stage"><canvas id="canvas" aria-label="迷宫生成与寻路动画"></canvas><header class="stage-header"><div class="live"><i></i><div><span>当前阶段</span><strong id="status">正在生成迷宫</strong></div></div><div class="metrics" aria-live="polite"><div><span>已开凿</span><strong id="carved">0</strong></div><div><span>搜索节点</span><strong id="searched">0</strong></div><div><span>路径长度</span><strong id="path-length">--</strong></div></div><div class="actions"><button id="regenerate" type="button"><span aria-hidden="true">✦</span><b>新迷宫</b></button><button id="pause" class="primary" type="button"><span id="pause-icon" aria-hidden="true">Ⅱ</span><b id="pause-label">暂停</b></button></div></header><div class="stage-note"><span id="algorithm-label">RECURSIVE BACKTRACKER</span><i></i><span id="size-label">38 × 28</span></div></main></div><script src="app.js"></script></body></html>
