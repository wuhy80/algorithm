<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#12191b"><title>Swarm Lab · 粒子群优化实验场</title><link rel="stylesheet" href="styles.css"></head><body>
<div class="lab-shell"><aside class="panel"><header class="brand"><div class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></div><div><span>SWARM LAB / PSO</span><h1>粒子群优化实验场</h1></div></header>
<section><div class="section-title"><h2>目标函数</h2><small>01</small></div><div class="tool-grid" id="functions" role="group" aria-label="目标函数"><button type="button" data-function="rastrigin" aria-pressed="true">Rastrigin</button><button type="button" data-function="ackley" aria-pressed="false">Ackley</button><button type="button" data-function="himmelblau" aria-pressed="false">Himmelblau</button><button type="button" data-function="sphere" aria-pressed="false">Sphere</button></div><div class="legend"><span><i class="food"></i>低值区域</span><span><i class="nest"></i>粒子</span><span><i class="trail"></i>速度尾迹</span></div></section>
<section><div class="section-title"><h2>群体参数</h2><small>02</small></div><label class="range" for="count"><span><b>粒子数量</b><output id="count-value">180</output></span><input id="count" type="range" min="30" max="500" step="10" value="180"></label><label class="range" for="max-speed"><span><b>速度上限</b><output id="max-speed-value">0.18</output></span><input id="max-speed" type="range" min="0.03" max="0.5" step="0.01" value="0.18"></label></section>
<section><div class="section-title"><h2>学习权重</h2><small>03</small></div><label class="range" for="inertia"><span><b>惯性权重 ω</b><output id="inertia-value">0.72</output></span><input id="inertia" type="range" min="0.1" max="1.2" step="0.01" value="0.72"></label><label class="range" for="cognitive"><span><b>个体认知 c₁</b><output id="cognitive-value">1.35</output></span><input id="cognitive" type="range" min="0" max="3" step="0.05" value="1.35"></label><label class="range" for="social"><span><b>群体协同 c₂</b><output id="social-value">1.55</output></span><input id="social" type="range" min="0" max="3" step="0.05" value="1.55"></label></section><footer><span>COLLECTIVE SEARCH</span><span>GLOBAL BEST</span></footer></aside>
<main class="stage"><canvas id="canvas" aria-label="粒子群优化目标函数地形"></canvas><header class="stage-header"><div class="live"><i></i><div><span>正在优化</span><strong id="function-name">Rastrigin 多峰函数</strong></div></div><div class="metrics" aria-live="polite"><div><span>全局最优</span><strong id="best">--</strong></div><div><span>迭代</span><strong id="iteration">0</strong></div><div><span>群体离散度</span><strong id="diversity">0%</strong></div></div><div class="actions"><button id="reset" type="button"><span aria-hidden="true">✦</span><b>重新散布</b></button><button id="pause" class="primary" type="button"><span id="pause-icon" aria-hidden="true">Ⅱ</span><b id="pause-label">暂停</b></button></div></header><div class="stage-note"><span>目标函数等高地形</span><i></i><span id="position">BEST (0.00, 0.00)</span></div></main></div><script src="app.js"></script></body></html>
