<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#11181a"><link rel="icon" href="data:,"><title>Insert Lab · 插入排序</title><link rel="stylesheet" href="styles.css"></head><body><div class="shell"><aside class="panel"><header class="brand"><b>IS</b><div><small>SORT / INSERT</small><h1>插入排序</h1></div></header><section><h2>排序数据 <i>01</i></h2><label class="field" for="data">数组（最多 40 项）<textarea id="data">58, 21, 73, 14, 46, 89, 32, 67, 9, 51, 27, 80</textarea></label><button id="apply" class="wide" type="button">应用数据</button><p id="error" class="error"></p></section><section><h2>播放参数 <i>02</i></h2><label class="range" for="speed"><span>播放速度 <output id="speed-value">1.0×</output></span><input id="speed" type="range" min="0.25" max="3" step="0.25" value="1"></label><p>取出当前元素，把较大的已排序元素向右移动，再将其插入空位。</p></section><footer>SHIFT AND INSERT · O(N²)</footer></aside><main class="stage"><canvas id="canvas" aria-label="插入排序移动与插入动画"></canvas><header class="top"><div class="live"><i></i><span><small>当前状态</small><strong id="status">准备排序</strong></span></div><div class="stats"><span>比较 <b id="comparisons">0</b></span><span>移动 <b id="moves">0</b></span><span>已排序 <b id="sorted">1</b></span></div><div class="actions"><button id="random" type="button">随机</button><button id="step" type="button">单步</button><button id="play" class="primary" type="button">播放</button></div></header><div class="note" id="note">维护左侧有序区间</div></main></div><script src="app.js"></script></body></html>
