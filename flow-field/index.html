<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#12191b"><title>Flow Lab · Perlin 噪声流场</title><link rel="stylesheet" href="styles.css"></head><body>
<div class="lab-shell"><aside class="panel"><header class="brand"><div class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></div><div><span>FLOW LAB / NOISE</span><h1>Perlin 噪声流场</h1></div></header>
<section><div class="section-title"><h2>粒子系统</h2><small>01</small></div><label class="range" for="count"><span><b>粒子数量</b><output id="count-value">3500</output></span><input id="count" type="range" min="300" max="9000" step="100" value="3500"></label><label class="range" for="speed"><span><b>流动速度</b><output id="speed-value">1.8</output></span><input id="speed" type="range" min="0.4" max="5" step="0.1" value="1.8"></label><label class="range" for="fade"><span><b>轨迹衰减</b><output id="fade-value">8%</output></span><input id="fade" type="range" min="2" max="30" step="1" value="8"></label></section>
<section><div class="section-title"><h2>向量场</h2><small>02</small></div><label class="range" for="scale"><span><b>噪声尺度</b><output id="scale-value">1.4</output></span><input id="scale" type="range" min="0.3" max="4" step="0.1" value="1.4"></label><label class="range" for="turns"><span><b>方向旋度</b><output id="turns-value">2.2</output></span><input id="turns" type="range" min="0.5" max="5" step="0.1" value="2.2"></label><label class="range" for="evolution"><span><b>时间演化</b><output id="evolution-value">0.35</output></span><input id="evolution" type="range" min="0" max="1.5" step="0.05" value="0.35"></label><div class="check-row"><label for="vectors"><input id="vectors" type="checkbox">显示向量网格</label></div></section>
<section><div class="section-title"><h2>鼠标力场</h2><small>03</small></div><div class="tool-grid" id="tools" role="group" aria-label="鼠标力场"><button type="button" data-tool="vortex" aria-pressed="true">涡旋</button><button type="button" data-tool="attract" aria-pressed="false">吸引</button><button type="button" data-tool="repel" aria-pressed="false">排斥</button><button type="button" data-tool="none" aria-pressed="false">关闭</button></div><div class="legend"><span><i class="nest"></i>主流线</span><span><i class="food"></i>高能粒子</span><span><i class="trail"></i>方向轨迹</span></div></section><footer><span>COHERENT NOISE</span><span>VECTOR FIELD</span></footer></aside>
<main class="stage"><canvas id="canvas" aria-label="Perlin 噪声粒子流场动画"></canvas><header class="stage-header"><div class="live"><i></i><div><span>连续向量场</span><strong>Perlin Flow / 2D</strong></div></div><div class="metrics" aria-live="polite"><div><span>粒子</span><strong id="metric-count">3500</strong></div><div><span>帧率</span><strong id="fps">60</strong></div><div><span>场时间</span><strong id="field-time">0.00</strong></div></div><div class="actions"><button id="reset" type="button"><span aria-hidden="true">✦</span><b>重新播种</b></button><button id="pause" class="primary" type="button"><span id="pause-icon" aria-hidden="true">Ⅱ</span><b id="pause-label">暂停</b></button></div></header><div class="stage-note"><span id="tool-label">涡旋力场</span><i></i><span>PERLIN / SEEDED</span></div></main></div><script src="app.js"></script></body></html>
