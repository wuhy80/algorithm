<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#171619"><link rel="icon" href="data:,"><title>Hull Lab · 凸包</title><link rel="stylesheet" href="styles.css"></head><body><div class="shell"><aside class="panel"><header class="brand"><b>CH</b><div><small>GEOMETRY / MONOTONIC CHAIN</small><h1>凸包</h1></div></header><section><h2>点集参数 <i>01</i></h2><label class="range"><span>点数量 <output id="count-value">28</output></span><input id="count" type="range" min="8" max="70" step="1" value="28"></label><button id="random" class="wide" type="button">随机点集</button><p>可直接点击画布添加点。算法按 x、y 排序后分别构建下凸包与上凸包。</p></section><section><h2>演示参数 <i>02</i></h2><label class="range"><span>播放速度 <output id="speed-value">1.0×</output></span><input id="speed" type="range" min="0.25" max="3" step="0.25" value="1"></label></section><footer>CROSS PRODUCT · O(N LOG N)</footer></aside><main class="stage"><canvas id="canvas" aria-label="单调链凸包叉积与栈动画"></canvas><header class="top"><div class="live"><i></i><span><small>当前步骤</small><strong id="status">准备构建凸包</strong></span></div><div class="stats"><span>已排序点 <b id="processed">0</b></span><span>弹栈 <b id="pops">0</b></span><span>凸包点 <b id="hull-size">0</b></span></div><div class="actions"><button id="reset" type="button">重算</button><button id="step" type="button">单步</button><button id="play" class="primary" type="button">播放</button></div></header><div class="note" id="note">点击画布添加点</div></main></div><script src="app.js"></script></body></html>
