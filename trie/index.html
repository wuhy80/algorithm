<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#15171b"><link rel="icon" href="data:,"><title>Prefix Lab · Trie 前缀树</title><link rel="stylesheet" href="styles.css"></head><body><div class="shell"><aside class="panel"><header class="brand"><b>TR</b><div><small>STRUCTURE / PREFIX TREE</small><h1>Trie 前缀树</h1></div></header><section><h2>单词操作 <i>01</i></h2><label class="field">单词<input id="word" maxlength="10" value="team"></label><div class="tools"><button id="insert" type="button">插入</button><button id="search" type="button">查找</button><button id="remove" type="button">删除</button><button id="prefix" type="button">前缀</button></div></section><section><h2>演示参数 <i>02</i></h2><label class="range"><span>播放速度 <output id="speed-value">1.0×</output></span><input id="speed" type="range" min="0.25" max="3" step="0.25" value="1"></label><p>公共前缀共享路径；实心终点表示从根到该节点构成一个完整单词。</p></section><footer>WORDS SHARE PREFIXES</footer></aside><main class="stage"><canvas id="canvas" aria-label="Trie 插入、查找和删除动画"></canvas><header class="top"><div class="live"><i></i><span><small>当前操作</small><strong id="status">等待操作</strong></span></div><div class="stats"><span>单词 <b id="words">0</b></span><span>节点 <b id="nodes">1</b></span><span>深度 <b id="depth">0</b></span></div><div class="actions"><button id="sample" type="button">示例</button><button id="step" type="button">单步</button><button id="play" class="primary" type="button">播放</button></div></header><div class="note" id="note">ROOT</div></main></div><script src="app.js"></script></body></html>
