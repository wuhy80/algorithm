<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#171619"><link rel="icon" href="data:,"><title>RB Tree Lab · 红黑树</title><link rel="stylesheet" href="styles.css"></head><body><div class="shell"><aside class="panel"><header class="brand"><b>RB</b><div><small>TREE / BALANCED BST</small><h1>红黑树</h1></div></header><section><h2>节点操作 <i>01</i></h2><label class="field">节点值<input id="value" type="number" min="0" max="999" value="28"></label><div class="tools"><button id="insert" type="button">插入节点</button><button id="search" type="button">查找路径</button></div><p id="error" class="error"></p></section><section><h2>演示参数 <i>02</i></h2><label class="range"><span>播放速度 <output id="speed-value">1.0×</output></span><input id="speed" type="range" min="0.25" max="3" step="0.25" value="1"></label><p>新节点先染红；若父节点也是红色，则通过叔节点变色或旋转恢复性质。</p></section><footer>RED / BLACK INVARIANTS</footer></aside><main class="stage"><canvas id="canvas" aria-label="红黑树插入修复、变色与旋转动画"></canvas><header class="top"><div class="live"><i></i><span><small>当前步骤</small><strong id="status">等待插入</strong></span></div><div class="stats"><span>节点 <b id="nodes">0</b></span><span>黑高 <b id="black-height">0</b></span><span>旋转 <b id="rotations">0</b></span></div><div class="actions"><button id="reset" type="button">重置</button><button id="step" type="button">单步</button><button id="play" class="primary" type="button">播放</button></div></header><div class="note" id="note">ROOT IS BLACK</div></main></div><script src="app.js"></script></body></html>
