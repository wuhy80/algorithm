name: Validate catalog

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate catalog and generated documentation
        run: |
          python tests/catalog_integrity.py
          python tests/problem_solutions.py
          node scripts/generate-problems.mjs --check
          node scripts/sync-leetcode-index.mjs --check
          node scripts/generate-readme.mjs --check
      - name: Check JavaScript syntax
        run: |
          node --check site.js
          node --check activity-selection/app.js
          node --check octree/app.js
          node --check scripts/core-batch-app.js
          node --check scripts/scaffold-core-batch.mjs
          node --check scripts/foundation-batch-app.js
          node --check scripts/scaffold-foundation-batch.mjs
          node --check scripts/learning-guide.mjs
          node --check scripts/enrich-learning-metadata.mjs
          node --check scripts/scaffold-neural-network-batch.mjs
          node --check scripts/neural-network-batch-app.js
          node --check scripts/problem-batch-a.mjs
          node --check scripts/problem-batch-b.mjs
          node --check scripts/problem-batch-c.mjs
          node --check scripts/generate-problems.mjs
          node --check scripts/generate-readme.mjs
          node --check scripts/sync-leetcode-index.mjs
          node --check problems/app.js
          node --check problems/leetcode-index.js
          node --check problems/python-worker.js
          node --check guides/app.js
          node --check neural-network-tools/app.js

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser test dependencies
        run: |
          python -m pip install -r requirements-test.txt
          python -m playwright install --with-deps chromium
      - name: Run browser smoke tests
        run: python tests/browser_smoke.py
