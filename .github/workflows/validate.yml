name: Validate catalog

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate catalog and generated documentation
        run: python tests/catalog_integrity.py
      - name: Check JavaScript syntax
        run: |
          node --check site.js
          node --check activity-selection/app.js
          node --check octree/app.js
          node --check scripts/core-batch-app.js
          node --check scripts/scaffold-core-batch.mjs

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser test dependencies
        run: |
          python -m pip install -r requirements-test.txt
          python -m playwright install --with-deps chromium
      - name: Run browser smoke tests
        run: python tests/browser_smoke.py
