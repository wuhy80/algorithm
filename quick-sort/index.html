<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="theme-color" content="#101719"><title>Partition Lab · 快速排序</title><link rel="stylesheet" href="styles.css"></head><body><div class="lab-shell">
<aside class="panel"><header class="brand"><div class="brand-mark" aria-hidden="true"><i></i><i></i><b></b></div><div><span>PARTITION LAB / 03</span><h1>快速排序</h1></div></header>
<section><div class="section-title"><h2>数据设置</h2><small>01</small></div><label class="field" for="pattern"><span>生成方式</span><select id="pattern"><option value="random">随机数据</option><option value="reversed">逆序数据</option><option value="duplicates">重复值较多</option></select></label><label class="range" for="size"><span><b>元素数量</b><output id="size-value">32</output></span><input id="size" type="range" min="8" max="64" step="1" value="32"></label><button id="generate" class="panel-button" type="button">生成新数据</button></section>
<section><div class="section-title"><h2>分区策略</h2><small>02</small></div><label class="field" for="pivot-strategy"><span>枢轴选择</span><select id="pivot-strategy"><option value="last">末尾元素</option><option value="random">随机元素</option><option value="median">三数取中</option></select></label><label class="range" for="speed"><span><b>播放速度</b><output id="speed-value">1.0×</output></span><input id="speed" type="range" min="0.25" max="4" step="0.25" value="1"></label></section>
<section><div class="section-title"><h2>自定义数组</h2><small>03</small></div><label class="field" for="custom-data"><span>数字（逗号或空格分隔）</span><textarea id="custom-data" rows="3" placeholder="45, 12, 67, 23, 9"></textarea></label><button id="apply-data" class="panel-button secondary" type="button">应用输入</button><p class="validation" id="validation"></p><div class="legend"><span><i class="range-key"></i>当前分区</span><span><i class="scan-key"></i>扫描元素</span><span><i class="pivot-key"></i>枢轴</span><span><i class="fixed-key"></i>位置已固定</span></div></section><footer><span>PARTITION & CONQUER</span><span>AVG O(N LOG N)</span></footer></aside>
<main class="stage"><canvas id="canvas" aria-label="快速排序分区过程动画"></canvas><header class="stage-header"><div class="live"><i></i><div><span id="phase-label">等待开始</span><strong id="status-text">选择枢轴并分区</strong></div></div><div class="metrics"><div><span>比较</span><strong id="comparisons">0</strong></div><div><span>交换</span><strong id="swaps">0</strong></div><div><span>区间栈</span><strong id="stack-depth">1</strong></div></div><div class="actions"><button id="reset" type="button"><span>↻</span><b>重置</b></button><button id="step" type="button"><span>→</span><b>单步</b></button><button id="play" class="primary" type="button"><span id="play-icon">▶</span><b id="play-label">播放</b></button></div></header><div class="stage-note"><span id="range-status">RANGE [0, 31]</span><i></i><span>小于枢轴 · 枢轴 · 大于枢轴</span></div></main></div><script src="app.js"></script></body></html>
