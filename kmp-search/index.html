<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#15171b"><link rel="icon" href="data:,"><title>KMP Lab · 字符串匹配</title><link rel="stylesheet" href="styles.css"></head><body><div class="shell"><aside class="panel"><header class="brand"><b>KM</b><div><small>STRING / PREFIX FUNCTION</small><h1>KMP 字符串匹配</h1></div></header><section><h2>匹配内容 <i>01</i></h2><label class="field">文本<input id="text" maxlength="36" value="ABABDABACDABABCABAB"></label><label class="field">模式串<input id="pattern" maxlength="16" value="ABABCABAB"></label><button id="apply" class="wide" type="button">构建匹配步骤</button><p id="error" class="error"></p></section><section><h2>演示参数 <i>02</i></h2><label class="range"><span>播放速度 <output id="speed-value">1.0×</output></span><input id="speed" type="range" min="0.25" max="3" step="0.25" value="1"></label><p>失配时使用 LPS 前缀表移动模式串，不回退文本指针。</p></section><footer>KNUTH · MORRIS · PRATT</footer></aside><main class="stage"><canvas id="canvas" aria-label="KMP 前缀表和字符串匹配动画"></canvas><header class="top"><div class="live"><i></i><span><small>当前阶段</small><strong id="status">准备构建 LPS</strong></span></div><div class="stats"><span>比较 <b id="comparisons">0</b></span><span>文本索引 <b id="text-index">--</b></span><span>结果 <b id="result">--</b></span></div><div class="actions"><button id="sample" type="button">示例</button><button id="step" type="button">单步</button><button id="play" class="primary" type="button">播放</button></div></header><div class="note" id="note">PREFIX TABLE</div></main></div><script src="app.js"></script></body></html>
