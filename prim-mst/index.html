<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#12191b"><link rel="icon" href="data:,"><title>Prim Lab · 最小生成树</title><link rel="stylesheet" href="styles.css"></head><body><div class="shell"><aside class="panel"><header class="brand"><b>PM</b><div><small>GRAPH / GREEDY TREE</small><h1>Prim 最小生成树</h1></div></header><section><h2>起始节点 <i>01</i></h2><div class="selects"><label>起点<select id="start"><option>A</option><option>B</option><option>C</option><option>D</option><option>E</option><option>F</option><option>G</option><option>H</option></select></label></div><button id="apply" class="wide" type="button">重新生成</button></section><section><h2>演示参数 <i>02</i></h2><label class="range"><span>播放速度 <output id="speed-value">1.0×</output></span><input id="speed" type="range" min="0.25" max="3" step="0.25" value="1"></label><p>从一个节点开始，每次选择连接“树内”与“树外”的最轻边。</p></section><footer>CUT PROPERTY · MST</footer></aside><main class="stage"><canvas id="canvas" aria-label="Prim 最小生成树生长动画"></canvas><header class="top"><div class="live"><i></i><span><small>当前步骤</small><strong id="status">准备生成</strong></span></div><div class="stats"><span>树节点 <b id="visited">1</b></span><span>树边 <b id="edges">0</b></span><span>总权重 <b id="weight">0</b></span></div><div class="actions"><button id="random" type="button">新权重</button><button id="step" type="button">单步</button><button id="play" class="primary" type="button">播放</button></div></header><div class="note" id="note">从起点向外生长</div></main></div><script src="app.js"></script></body></html>
