<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#12191b"><link rel="icon" href="data:,"><title>Route Lab · Dijkstra 最短路</title><link rel="stylesheet" href="styles.css"></head><body><div class="shell"><aside class="panel"><header class="brand"><b>DJ</b><div><small>GRAPH / SHORTEST PATH</small><h1>Dijkstra 最短路</h1></div></header><section><h2>路径端点 <i>01</i></h2><div class="selects"><label>起点<select id="start"><option>A</option><option>B</option><option>C</option><option>D</option><option>E</option><option>F</option><option>G</option><option>H</option></select></label><label>终点<select id="end"><option>H</option><option>G</option><option>F</option><option>E</option><option>D</option><option>C</option><option>B</option><option>A</option></select></label></div><button id="apply" class="wide" type="button">重新计算</button></section><section><h2>演示参数 <i>02</i></h2><label class="range"><span>播放速度 <output id="speed-value">1.0×</output></span><input id="speed" type="range" min="0.25" max="3" step="0.25" value="1"></label><p>每次固定距离最小的未访问节点，再尝试用它缩短相邻节点的距离。</p></section><footer>NON-NEGATIVE WEIGHTS</footer></aside><main class="stage"><canvas id="canvas" aria-label="Dijkstra 距离松弛动画"></canvas><header class="top"><div class="live"><i></i><span><small>当前步骤</small><strong id="status">准备计算</strong></span></div><div class="stats"><span>已固定 <b id="visited">0</b></span><span>松弛 <b id="relaxations">0</b></span><span>距离 <b id="distance">∞</b></span></div><div class="actions"><button id="random" type="button">新权重</button><button id="step" type="button">单步</button><button id="play" class="primary" type="button">播放</button></div></header><div class="note" id="note">DIST[A] = 0</div></main></div><script src="app.js"></script></body></html>
