<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#171619"><link rel="icon" href="data:,"><title>BIT Lab · 树状数组</title><link rel="stylesheet" href="styles.css"></head><body><div class="shell"><aside class="panel"><header class="brand"><b>BIT</b><div><small>RANGE / LOWBIT</small><h1>树状数组</h1></div></header><section><h2>索引操作 <i>01</i></h2><div class="selects"><label>索引（1-based）<input id="index-input" type="number" min="1" max="12" value="8"></label><label>增量<input id="delta" type="number" value="5"></label></div><div class="tools"><button id="prefix" type="button">前缀和</button><button id="update" type="button">增加增量</button></div></section><section><h2>演示参数 <i>02</i></h2><label class="range"><span>播放速度 <output id="speed-value">1.0×</output></span><input id="speed" type="range" min="0.25" max="3" step="0.25" value="1"></label><p>`lowbit(i)` 决定 BIT[i] 覆盖的区间，也决定查询向左、更新向右的跳转距离。</p></section><footer>INDEX ± LOWBIT(INDEX)</footer></aside><main class="stage"><canvas id="canvas" aria-label="树状数组 lowbit 跳转和覆盖区间动画"></canvas><header class="top"><div class="live"><i></i><span><small>当前步骤</small><strong id="status">等待操作</strong></span></div><div class="stats"><span>访问节点 <b id="visited">0</b></span><span>查询结果 <b id="result">--</b></span><span>数组长度 <b>12</b></span></div><div class="actions"><button id="random" type="button">随机</button><button id="step" type="button">单步</button><button id="play" class="primary" type="button">播放</button></div></header><div class="note" id="note">LOWBIT STRUCTURE</div></main></div><script src="app.js"></script></body></html>
