<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#12191b"><title>Evolution Lab · 遗传火箭实验场</title><link rel="stylesheet" href="styles.css"></head><body>
<div class="lab-shell"><aside class="panel"><header class="brand"><div class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></div><div><span>EVOLUTION LAB / GA</span><h1>遗传火箭实验场</h1></div></header>
<section><div class="section-title"><h2>种群</h2><small>01</small></div><label class="range" for="population"><span><b>火箭数量</b><output id="population-value">220</output></span><input id="population" type="range" min="40" max="450" step="10" value="220"></label><label class="range" for="lifespan"><span><b>基因序列长度</b><output id="lifespan-value">260</output></span><input id="lifespan" type="range" min="100" max="360" step="10" value="260"></label><label class="range" for="speed"><span><b>演化速度</b><output id="speed-value">3×</output></span><input id="speed" type="range" min="1" max="8" step="1" value="3"></label></section>
<section><div class="section-title"><h2>遗传参数</h2><small>02</small></div><label class="range" for="mutation"><span><b>变异率</b><output id="mutation-value">1.5%</output></span><input id="mutation" type="range" min="0" max="12" step="0.5" value="1.5"></label><label class="range" for="elite"><span><b>精英保留</b><output id="elite-value">5%</output></span><input id="elite" type="range" min="0" max="20" step="1" value="5"></label><label class="range" for="thrust"><span><b>推力强度</b><output id="thrust-value">0.16</output></span><input id="thrust" type="range" min="0.05" max="0.35" step="0.01" value="0.16"></label></section>
<section><div class="section-title"><h2>任务场景</h2><small>03</small></div><div class="tool-grid" id="tools" role="group" aria-label="场景编辑"><button type="button" data-tool="target" aria-pressed="true">移动目标</button><button type="button" data-tool="obstacle" aria-pressed="false">添加障碍</button><button type="button" data-action="preset">恢复场景</button><button type="button" data-action="clear">清除障碍</button></div><div class="legend"><span><i class="nest"></i>目标</span><span><i class="food"></i>成功个体</span><span><i class="trail"></i>运动方向</span></div></section><footer><span>SELECTION + CROSSOVER</span><span>MUTATION</span></footer></aside>
<main class="stage"><canvas id="canvas" aria-label="遗传算法火箭演化动画"></canvas><header class="stage-header"><div class="live"><i></i><div><span>演化任务</span><strong id="status">第 1 代飞行中</strong></div></div><div class="metrics" aria-live="polite"><div><span>当前代</span><strong id="generation">1</strong></div><div><span>成功个体</span><strong id="success">0</strong></div><div><span>最近距离</span><strong id="distance">--</strong></div></div><div class="actions"><button id="restart" type="button"><span aria-hidden="true">✦</span><b>重新进化</b></button><button id="pause" class="primary" type="button"><span id="pause-icon" aria-hidden="true">Ⅱ</span><b id="pause-label">暂停</b></button></div></header><div class="stage-note"><span>每一代共享同一段生存时间</span><i></i><span id="life">0 / 260</span></div></main></div><script src="app.js"></script></body></html>
