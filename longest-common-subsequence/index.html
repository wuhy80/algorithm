<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#15171b"><link rel="icon" href="data:,"><title>LCS Lab · 最长公共子序列</title><link rel="stylesheet" href="styles.css"></head><body><div class="shell"><aside class="panel"><header class="brand"><b>LC</b><div><small>DP / SEQUENCES</small><h1>最长公共子序列</h1></div></header><section><h2>输入序列 <i>01</i></h2><label class="field">序列 A<input id="a" maxlength="12" value="ALGORITHM"></label><label class="field">序列 B<input id="b" maxlength="12" value="LOGARITHM"></label><button id="apply" class="wide" type="button">建立状态表</button><p id="error" class="error"></p></section><section><h2>演示参数 <i>02</i></h2><label class="range"><span>播放速度 <output id="speed-value">1.0×</output></span><input id="speed" type="range" min="0.25" max="3" step="0.25" value="1"></label><p>字符相同时沿左上角加一，否则取上方与左方的较大值。</p></section><footer>DP[I][J] · O(MN)</footer></aside><main class="stage"><canvas id="canvas" aria-label="最长公共子序列动态规划表动画"></canvas><header class="top"><div class="live"><i></i><span><small>当前状态</small><strong id="status">准备填表</strong></span></div><div class="stats"><span>单元格 <b id="cells">0</b></span><span>长度 <b id="length">0</b></span><span>序列 <b id="sequence">--</b></span></div><div class="actions"><button id="sample" type="button">示例</button><button id="step" type="button">单步</button><button id="play" class="primary" type="button">播放</button></div></header><div class="note" id="note">DP TABLE</div></main></div><script src="app.js"></script></body></html>
