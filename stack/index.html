<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101817">
  <link rel="icon" href="data:,">
  <title>Stack Lab · 栈结构实验场</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="lab-shell">
    <aside class="panel">
      <header class="brand"><div class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></div><div><span>STACK LAB / LIFO</span><h1>栈结构实验场</h1></div></header>
      <section>
        <div class="section-title"><h2>栈操作</h2><small>01</small></div>
        <label class="field" for="value"><span>元素值</span><input id="value" type="number" min="0" max="999" value="64"></label>
        <div class="tool-grid"><button id="push" class="selected" type="button">压栈 Push</button><button id="pop" type="button">出栈 Pop</button><button id="peek" type="button">查看 Peek</button><button id="step" type="button">单步操作</button></div>
      </section>
      <section>
        <div class="section-title"><h2>演示参数</h2><small>02</small></div>
        <label class="range" for="capacity"><span><b>栈容量</b><output id="capacity-value">8</output></span><input id="capacity" type="range" min="4" max="12" step="1" value="8"></label>
        <label class="range" for="speed"><span><b>动画速度</b><output id="speed-value">1.0×</output></span><input id="speed" type="range" min="0.4" max="2.4" step="0.2" value="1"></label>
        <label class="check"><input id="auto" type="checkbox" checked><span>自动生成操作</span></label>
      </section>
      <section>
        <div class="section-title"><h2>核心规则</h2><small>03</small></div>
        <p class="rule"><b>LIFO</b> 后进入的元素最先离开。压栈和出栈只访问栈顶，因此时间复杂度均为 O(1)。</p>
      </section>
      <footer><span>LAST IN</span><span>FIRST OUT</span></footer>
    </aside>
    <main class="stage">
      <canvas id="canvas" aria-label="栈的压栈、出栈与查看动画"></canvas>
      <header class="stage-header">
        <div class="live"><i></i><div><span>当前操作</span><strong id="status">等待操作</strong></div></div>
        <div class="metrics"><div><span>元素数量</span><strong id="size">0</strong></div><div><span>剩余空间</span><strong id="free">0</strong></div><div><span>操作次数</span><strong id="operations">0</strong></div></div>
        <div class="actions"><button id="reset" type="button"><span aria-hidden="true">↺</span><b>重置</b></button><button id="pause" class="primary" type="button"><span id="pause-icon" aria-hidden="true">Ⅱ</span><b id="pause-label">暂停</b></button></div>
      </header>
      <div class="stage-note"><span>BOTTOM</span><i></i><span id="top-label">TOP = -1</span></div>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
