<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#15171b"><link rel="icon" href="data:,"><title>Knapsack Lab · 0/1 背包</title><link rel="stylesheet" href="styles.css"></head><body><div class="shell"><aside class="panel"><header class="brand"><b>01</b><div><small>DP / OPTIMAL VALUE</small><h1>0/1 背包</h1></div></header><section><h2>背包参数 <i>01</i></h2><label class="range"><span>容量 <output id="capacity-value">16</output></span><input id="capacity" type="range" min="8" max="24" step="1" value="16"></label><button id="random" class="wide" type="button">随机物品</button><p id="items">重量 2/3/4/5/7 · 价值 6/5/8/9/12</p></section><section><h2>演示参数 <i>02</i></h2><label class="range"><span>播放速度 <output id="speed-value">1.0×</output></span><input id="speed" type="range" min="0.25" max="3" step="0.25" value="1"></label><p>每件物品只能选择一次，表格比较“不选”和“选择后加上剩余容量最优值”。</p></section><footer>DP[I][W] · O(NW)</footer></aside><main class="stage"><canvas id="canvas" aria-label="0/1 背包动态规划表动画"></canvas><header class="top"><div class="live"><i></i><span><small>当前状态</small><strong id="status">准备填表</strong></span></div><div class="stats"><span>单元格 <b id="cells">0</b></span><span>最优值 <b id="best">0</b></span><span>已选物品 <b id="chosen">--</b></span></div><div class="actions"><button id="reset" type="button">重置</button><button id="step" type="button">单步</button><button id="play" class="primary" type="button">播放</button></div></header><div class="note" id="note">DP TABLE</div></main></div><script src="app.js"></script></body></html>
