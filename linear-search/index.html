<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#11181a"><link rel="icon" href="data:,"><title>Scan Lab · 线性查找</title><link rel="stylesheet" href="styles.css"></head><body><div class="shell"><aside class="panel"><header class="brand"><b>LS</b><div><small>SEARCH / SEQUENTIAL</small><h1>线性查找</h1></div></header><section><h2>查找数据 <i>01</i></h2><label class="field" for="data">数组（空格或逗号分隔）<textarea id="data">42, 17, 8, 63, 29, 51, 12, 76, 34, 95, 23, 68</textarea></label><label class="field compact" for="target">目标值<input id="target" type="number" value="51"></label><button id="apply" class="wide" type="button">应用数据</button><p id="error" class="error" aria-live="polite"></p></section><section><h2>播放参数 <i>02</i></h2><label class="range" for="speed"><span>播放速度 <output id="speed-value">1.0×</output></span><input id="speed" type="range" min="0.25" max="3" step="0.25" value="1"></label><p>无需预先排序，从索引 0 开始逐项比较，直到命中目标或到达数组末尾。</p></section><footer>SEQUENTIAL ACCESS · O(N)</footer></aside><main class="stage"><canvas id="canvas" aria-label="线性查找逐项扫描动画"></canvas><header class="top"><div class="live"><i></i><span><small>当前状态</small><strong id="status">准备查找</strong></span></div><div class="stats"><span>比较 <b id="comparisons">0</b></span><span>索引 <b id="index">--</b></span><span>结果 <b id="result">--</b></span></div><div class="actions"><button id="random" type="button">随机</button><button id="step" type="button">单步</button><button id="play" class="primary" type="button">播放</button></div></header><div class="note" id="note">从左到右顺序扫描</div></main></div><script src="app.js"></script></body></html>
