<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#12191b"><link rel="icon" href="data:,"><title>Order Lab · 拓扑排序</title><link rel="stylesheet" href="styles.css"></head><body><div class="shell"><aside class="panel"><header class="brand"><b>TS</b><div><small>GRAPH / DEPENDENCIES</small><h1>拓扑排序</h1></div></header><section><h2>图结构 <i>01</i></h2><div class="selects"><label>预设<select id="preset"><option value="dag">课程依赖 DAG</option><option value="cycle">包含环的图</option></select></label></div><button id="apply" class="wide" type="button">加载预设</button><p>将所有入度为 0 的节点加入队列，依次移除节点及其出边；若仍有节点未处理，则图中存在环。</p></section><section><h2>演示参数 <i>02</i></h2><label class="range"><span>播放速度 <output id="speed-value">1.0×</output></span><input id="speed" type="range" min="0.25" max="3" step="0.25" value="1"></label></section><footer>KAHN ALGORITHM · DAG</footer></aside><main class="stage"><canvas id="canvas" aria-label="Kahn 拓扑排序入度和队列动画"></canvas><header class="top"><div class="live"><i></i><span><small>当前步骤</small><strong id="status">准备排序</strong></span></div><div class="stats"><span>已输出 <b id="output">0</b></span><span>队列 <b id="queue">0</b></span><span>剩余边 <b id="remaining">0</b></span></div><div class="actions"><button id="reset" type="button">重置</button><button id="step" type="button">单步</button><button id="play" class="primary" type="button">播放</button></div></header><div class="note" id="note">IN-DEGREE QUEUE</div></main></div><script src="app.js"></script></body></html>
