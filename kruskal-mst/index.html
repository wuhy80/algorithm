<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#12191b"><link rel="icon" href="data:,"><title>Kruskal Lab · 最小生成树</title><link rel="stylesheet" href="styles.css"></head><body><div class="shell"><aside class="panel"><header class="brand"><b>KR</b><div><small>GRAPH / SORT EDGES</small><h1>Kruskal 最小生成树</h1></div></header><section><h2>算法过程 <i>01</i></h2><button id="reset" class="wide" type="button">重建边序列</button><p>将全部边按权重升序排列；若一条边连接不同集合，就加入生成树并合并集合，否则拒绝它。</p></section><section><h2>演示参数 <i>02</i></h2><label class="range"><span>播放速度 <output id="speed-value">1.0×</output></span><input id="speed" type="range" min="0.25" max="3" step="0.25" value="1"></label></section><footer>EDGE SORT + UNION FIND</footer></aside><main class="stage"><canvas id="canvas" aria-label="Kruskal 边排序与并查集动画"></canvas><header class="top"><div class="live"><i></i><span><small>当前步骤</small><strong id="status">准备检查最轻边</strong></span></div><div class="stats"><span>已检查 <b id="checked">0</b></span><span>树边 <b id="edges">0</b></span><span>总权重 <b id="weight">0</b></span></div><div class="actions"><button id="random" type="button">新权重</button><button id="step" type="button">单步</button><button id="play" class="primary" type="button">播放</button></div></header><div class="note" id="note">边按权重升序排列</div></main></div><script src="app.js"></script></body></html>
