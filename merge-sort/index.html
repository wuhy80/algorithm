<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="theme-color" content="#131817"><title>Merge Lab · 归并排序</title><link rel="stylesheet" href="styles.css"></head><body><div class="lab-shell">
<aside class="panel"><header class="brand"><div class="brand-mark" aria-hidden="true"><i></i><i></i><b></b></div><div><span>MERGE LAB / 04</span><h1>归并排序</h1></div></header>
<section><div class="section-title"><h2>数据设置</h2><small>01</small></div><label class="field" for="pattern"><span>生成方式</span><select id="pattern"><option value="random">随机数据</option><option value="nearly">近乎有序</option><option value="reversed">完全逆序</option></select></label><label class="range" for="size"><span><b>元素数量</b><output id="size-value">32</output></span><input id="size" type="range" min="8" max="64" step="1" value="32"></label><button id="generate" class="panel-button" type="button">生成新数据</button></section>
<section><div class="section-title"><h2>自定义数组</h2><small>02</small></div><label class="field" for="custom-data"><span>数字（逗号或空格分隔）</span><textarea id="custom-data" rows="3" placeholder="38, 14, 62, 27, 9"></textarea></label><button id="apply-data" class="panel-button secondary" type="button">应用输入</button><p class="validation" id="validation"></p></section>
<section><div class="section-title"><h2>演示控制</h2><small>03</small></div><label class="range no-top" for="speed"><span><b>播放速度</b><output id="speed-value">1.0×</output></span><input id="speed" type="range" min="0.25" max="4" step="0.25" value="1"></label><div class="legend"><span><i class="left-key"></i>左有序段</span><span><i class="right-key"></i>右有序段</span><span><i class="pick-key"></i>当前读取</span><span><i class="buffer-key"></i>辅助数组</span></div></section><footer><span>DIVIDE · MERGE</span><span>O(N LOG N)</span></footer></aside>
<main class="stage"><canvas id="canvas" aria-label="归并排序有序段合并动画"></canvas><header class="stage-header"><div class="live"><i></i><div><span id="phase-label">等待开始</span><strong id="status-text">从长度 1 的有序段开始</strong></div></div><div class="metrics"><div><span>比较</span><strong id="comparisons">0</strong></div><div><span>写入</span><strong id="writes">0</strong></div><div><span>段长度</span><strong id="run-width">1</strong></div></div><div class="actions"><button id="reset" type="button"><span>↻</span><b>重置</b></button><button id="step" type="button"><span>→</span><b>单步</b></button><button id="play" class="primary" type="button"><span id="play-icon">▶</span><b id="play-label">播放</b></button></div></header><div class="stage-note"><span id="range-status">RUN WIDTH 1</span><i></i><span>辅助数组按序写回</span></div></main></div><script src="app.js"></script></body></html>
