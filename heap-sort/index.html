<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#11181a"><link rel="icon" href="data:,"><title>Heap Sort Lab · 堆排序</title><link rel="stylesheet" href="styles.css"></head><body><div class="shell"><aside class="panel"><header class="brand"><b>HS</b><div><small>SORT / MAX HEAP</small><h1>堆排序</h1></div></header><section><h2>排序数据 <i>01</i></h2><label class="field" for="data">数组（建议 6–18 项）<textarea id="data">41, 72, 18, 56, 33, 89, 24, 65, 12, 48, 77</textarea></label><button id="apply" class="wide" type="button">生成排序步骤</button><p id="error" class="error"></p></section><section><h2>播放参数 <i>02</i></h2><label class="range" for="speed"><span>播放速度 <output id="speed-value">1.0×</output></span><input id="speed" type="range" min="0.25" max="3" step="0.25" value="1"></label><p>先自底向上构建最大堆，再反复交换堆顶与末尾，并对剩余堆执行下沉。</p></section><footer>HEAPIFY · O(N LOG N)</footer></aside><main class="stage"><canvas id="canvas" aria-label="堆排序的树结构与数组动画"></canvas><header class="top"><div class="live"><i></i><span><small>当前阶段</small><strong id="status">准备构建最大堆</strong></span></div><div class="stats"><span>比较 <b id="comparisons">0</b></span><span>交换 <b id="swaps">0</b></span><span>堆大小 <b id="heap-size">0</b></span></div><div class="actions"><button id="random" type="button">随机</button><button id="step" type="button">单步</button><button id="play" class="primary" type="button">播放</button></div></header><div class="note" id="note">数组下标映射为完全二叉树</div></main></div><script src="app.js"></script></body></html>
